name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão, por exemplo v0.8.0"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04 # glibc mais antiga: o AppImage roda em mais distribuições
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libfontconfig1-dev libfreetype-dev \
            tesseract-ocr-por tesseract-ocr-eng
          # o Ubuntu 22.04 guarda os dados em tesseract-ocr/4.00 (tags antigas só olham os caminhos padrão)
          [ -e /usr/share/tessdata ] || sudo ln -s /usr/share/tesseract-ocr/*/tessdata /usr/share/tessdata
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/build-appimage.sh
      - name: Publicar o AppImage na release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Veja o CHANGELOG.md."
          gh release upload "$TAG" dist/Gera_PDF_Editor-x86_64.AppImage --clobber

  windows:
    # versão portátil do Windows, compilada no Linux com MinGW-w64 (variante posix: o Tesseract
    # usa std::thread)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config zip nsis \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix tesseract-ocr-por tesseract-ocr-eng
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: packaging/build-windows.sh
      - name: Publicar o ZIP e o instalador na release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Veja o CHANGELOG.md."
          gh release upload "$TAG" dist/Gera_PDF_Editor-*-windows-x64-* --clobber
