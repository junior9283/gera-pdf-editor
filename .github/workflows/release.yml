name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão, por exemplo v0.8.0"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04 # glibc mais antiga: o AppImage roda em mais distribuições
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libfontconfig1-dev libfreetype-dev \
            tesseract-ocr-por tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/build-appimage.sh
      - name: Publicar o AppImage na release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Veja o CHANGELOG.md."
          gh release upload "$TAG" dist/Gera_PDF_Editor-x86_64.AppImage --clobber
