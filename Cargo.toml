[workspace]
resolver = "2"
members = ["crates/pdf-core", "crates/app-state", "crates/gera-ui"]

[workspace.package]
version = "0.11.1"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# a geração de chave RSA (ID digital) é lenta sem otimização; os testes também a usam
[profile.dev.package.num-bigint-dig]
opt-level = 3
