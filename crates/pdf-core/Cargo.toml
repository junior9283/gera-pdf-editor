[package]
name = "pdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
flate2 = "1"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts", "docx-output", "tesseract"] }
quick-xml = "0.41"
thiserror = "2"
# Enviar formulário: o mesmo analisador de URL do envio (ureq), MIT/Apache
url = "2.5"
percent-encoding = "2.3"
# assinatura digital (v3d): CMS/PKCS#7, X.509, PKCS#12 — RustCrypto, MIT/Apache
aes = "0.8"
cbc = "0.1"
cms = { version = "0.2", features = ["builder"] }
const-oid = { version = "0.9", features = ["db"] }
der = "0.7"
jpeg-encoder = "0.7"
libc = "0.2"
md-5 = "0.10"
p12-keystore = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
regex = "1"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
tempfile = "3"
spki = "0.7"
x509-cert = { version = "0.2", features = ["builder"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
similar = "3.2"
# código de barras (v6e3): PDF417, QR Code e Data Matrix — porte do ZXing, Apache-2.0
rxing = { version = "0.9", default-features = false, features = ["encoders", "qrcode", "pdf417", "datamatrix", "encoding_rs"] }

[target.'cfg(windows)'.dependencies]
# espaço livre em disco no Windows (MIT/Apache)
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
# os testes leem de volta o código desenhado
rxing = { version = "0.9", default-features = false, features = ["encoders", "decoders", "qrcode", "pdf417", "datamatrix", "encoding_rs"] }
