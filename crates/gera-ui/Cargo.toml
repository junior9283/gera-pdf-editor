[package]
name = "gera-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gera-pdf-editor"
path = "src/main.rs"

[dependencies]
pdf-core = { path = "../pdf-core" }
app-state = { path = "../app-state" }
egui = "0.36"
rfd = "0.17"
arboard = "3.6"
png = "0.18"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
# Enviar formulário (http/https): MIT/Apache, rustls
ureq = { version = "2.12", default-features = false, features = ["tls"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
# janela de impressão do sistema pelo portal (org.freedesktop.portal.Print), MIT
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
# Windows: interface pelo wgpu (DirectX 12/WARP) e a API do sistema (impressão por GDI)
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
# a janela do app como dona da janela "Imprimir" (MIT/Apache)
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"

[features]
# seletores de arquivo pela variável GERA_E2E_PICK (só para os testes de interface)
e2e = []
